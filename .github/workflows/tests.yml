name: Simulation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[central,ai,dev]'
      - run: python -m pytest -q
      - run: ruff check src tests scripts
      - run: python scripts/adaptive_acceptance.py --directory runtime/ci-adaptive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-simulation-evidence
          path: |
            runtime/ci-adaptive/**/*.log
            runtime/ci-adaptive/**/*.h5
            runtime/ci-adaptive/**/acceptance.json
            runtime/ci-adaptive/adaptive-acceptance.json
          if-no-files-found: ignore
