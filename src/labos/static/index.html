<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LabOS · 实验控制台</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17324c;background:#eef3f7}body{margin:0}main{max-width:1150px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:30px}.tag{color:#936000;background:#fff3d0;padding:8px 12px;border-radius:8px}section{background:white;border:1px solid #dbe3eb;border-radius:12px;padding:20px;margin-top:18px}h2{font-size:19px;margin:0 0 14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{display:block;font-size:13px}input,textarea,select{box-sizing:border-box;width:100%;border:1px solid #bac9d6;border-radius:6px;padding:9px;margin-top:5px;font:inherit}textarea{min-height:95px}button{background:#1766a1;color:white;border:0;border-radius:6px;padding:10px 15px;cursor:pointer}button.secondary{background:#e4edf4;color:#17324c}button.danger{background:#a63636}button:disabled{opacity:.45;cursor:default}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;border-bottom:1px solid #e3eaf0;padding:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fa;padding:12px;max-height:300px;overflow:auto}.online{color:#13784a}.offline{color:#a63636}small{color:#547087}.token{flex:1;min-width:250px}canvas{max-width:100%;border:1px solid #e3eaf0;border-radius:8px}#message{min-height:20px;margin:12px 0;color:#9b3434}
</style></head><body><main>
<header><div><h1>LabOS</h1><small>中央规划 · 本地执行 · 数据追踪</small></div><span class="tag">模拟仪器模式 · 未连接真实硬件</span></header>
<section><div class="row"><label class="token">中央服务器操作凭证<input id="token" type="password" autocomplete="off" placeholder="粘贴 central/operator.token 内容"></label><button id="connect">连接</button><button id="logout" class="secondary">清除凭证</button></div><small>凭证仅保留在当前页面内存中，刷新页面后需要重新输入。</small></section>
<div id="message" role="status"></div>
<section><h2>实验室电脑与仪器</h2><div id="agents" class="row"></div><table><thead><tr><th>仪器</th><th>PC</th><th>状态</th><th>参数读回</th></tr></thead><tbody id="instruments"></tbody></table></section>
<section><h2>实验预准备</h2><label>装置配置<select id="setup_id"></select></label><pre id="setup_detail">连接后显示已登记装置的物理描述和校准说明。</pre>
<div class="grid" id="parameters"></div>
<label>自然语言实验描述（需中央服务器配置 OpenAI）<textarea id="prompt" placeholder="例如：在 650 nm 测量 0 到 180 度的偏振光谱，每隔 10 度测量一次。"></textarea></label>
<div class="row" style="margin-top:14px"><button id="draft" class="secondary">生成计划草稿</button><button id="prepare" class="secondary">检查实验准备</button><button id="start" disabled>Start · 开始模拟实验</button></div><pre id="preflight">填写参数后先检查实验准备。</pre></section>
<section><h2>实验运行</h2><div id="runs"></div></section>
<section><h2>最近光谱</h2><small>横轴：检测波长 nm；纵轴：模拟 counts。</small><br><canvas id="plot" width="950" height="250"></canvas></section>
<section><h2>实验事件</h2><pre id="events">暂无事件。</pre></section>
</main><script>
let token='', state=null, checkedPlan=null;
const $=id=>document.getElementById(id);
const fields=[['sample_id','样品 ID','demo_sample','text'],['wavelength_start_nm','起始波长 nm',650],['wavelength_stop_nm','终止波长 nm',650],['wavelength_step_nm','波长步长 nm',10],['angle_start_deg','起始机械角度 °',0],['angle_stop_deg','终止机械角度 °',180],['angle_step_deg','角度步长 °',10],['exposure_ms','曝光 ms',100],['power_percent','模拟功率 %',5],['sample_power_limit_percent','样品功率限制 %',10]];
for(const [id,label,value,type] of fields){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.id=id;i.type=type||'number';i.value=value;if(i.type==='number')i.step='any';i.addEventListener('input',invalidate);l.append(i);$('parameters').append(l);}
function invalidate(){checkedPlan=null;$('start').disabled=true;}
function plan(){const p={setup_id:$('setup_id').value};for(const [id,,,type]of fields)p[id]=type==='text'?$(id).value:Number($(id).value);return p;}
function message(text){$('message').textContent=text;}
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok){let detail;try{detail=(await r.json()).detail;}catch{detail='请求失败';}throw Error(typeof detail==='string'?detail:JSON.stringify(detail));}return r.json();}
function setupDetail(){const s=state?.setups.find(x=>x.id===$('setup_id').value);$('setup_detail').textContent=s?JSON.stringify(s,null,2):'未找到装置';}
$('setup_id').onchange=()=>{invalidate();setupDetail();};
async function refresh(){state=await api('/api/status');$('agents').replaceChildren();for(const a of state.agents){const el=document.createElement('span');el.textContent=a.id+' · '+(a.online?'在线':'离线');el.className=a.online?'online':'offline';$('agents').append(el);}
$('instruments').replaceChildren();for(const i of state.instruments){const tr=document.createElement('tr');for(const v of [i.id+' [模拟]',i.agent_id,(i.online?'在线':'离线')+(i.lock_run?' · 已占用':''),JSON.stringify({wavelength_nm:i.status.wavelength_nm,angle_deg:i.status.angle_deg,power_percent:i.status.power_percent,shutter_open:i.status.shutter_open})]){const td=document.createElement('td');td.textContent=v;tr.append(td);}$('instruments').append(tr);}
if(!$('setup_id').options.length){for(const s of state.setups){const option=document.createElement('option');option.value=s.id;option.textContent=s.id;$('setup_id').append(option);}setupDetail();}
$('runs').replaceChildren();for(const r of state.runs){const box=document.createElement('div');box.style.marginBottom='16px';const label=document.createElement('p');label.textContent=r.id+' · '+r.status+' · '+r.points+'/'+r.preflight.point_count+' 点'+(r.error?' · '+r.error:'');box.append(label);const row=document.createElement('div');row.className='row';for(const [action,title,allowed]of [['pause','暂停',['RUNNING']],['resume','继续',['PAUSED']],['stop','停止',['RUNNING','PAUSING','PAUSED']],['reconcile','核对并释放设备',['FAILED','INTERRUPTED']]]){if(allowed.includes(r.status)){const b=document.createElement('button');b.textContent=title;b.className=action==='stop'?'danger':'secondary';b.onclick=async()=>{try{await api('/api/runs/'+r.id+'/'+action,{});await refresh();message('');}catch(e){message(e.message);}};row.append(b);}}
if(r.points){const b=document.createElement('button');b.textContent='下载 HDF5';b.className='secondary';b.onclick=async()=>{try{const response=await fetch('/api/runs/'+r.id+'/export',{headers:{Authorization:'Bearer '+token}});if(!response.ok)throw Error('导出失败');const url=URL.createObjectURL(await response.blob());const link=document.createElement('a');link.href=url;link.download=r.id+'.h5';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){message(e.message);}};row.append(b);}box.append(row);$('runs').append(box);}
const latest=state.runs[0];if(latest){const data=await api('/api/runs/'+latest.id+'/measurements');if(data.length)draw(data[data.length-1]);const events=await api('/api/events?run_id='+encodeURIComponent(latest.id));$('events').textContent=events.map(e=>new Date(e.time*1000).toISOString()+' '+e.category+' '+JSON.stringify(e.detail)).join('\n');}}
function draw(m){const canvas=$('plot'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);const x=m.spectrum_axis_nm,y=m.counts,max=Math.max(...y,1);ctx.strokeStyle='#1766a1';ctx.beginPath();for(let i=0;i<x.length;i++){const px=45+(canvas.width-65)*i/(x.length-1||1),py=canvas.height-30-(canvas.height-60)*y[i]/max;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.stroke();ctx.fillStyle='#17324c';ctx.fillText(x[0]+' nm',40,canvas.height-10);ctx.fillText(x[x.length-1]+' nm',canvas.width-65,canvas.height-10);ctx.fillText('λ='+m.wavelength_nm+' nm · θ='+m.angle_deg+'° · 模拟数据',45,20);}
$('connect').onclick=async()=>{token=$('token').value.trim();try{await refresh();message('已连接。');}catch(e){message(e.message);}};
$('logout').onclick=()=>{token='';$('token').value='';state=null;invalidate();message('凭证已清除。');};
$('prepare').onclick=async()=>{try{const p=plan();const snapshot=await api('/api/preflight',p);checkedPlan=JSON.stringify(p);$('preflight').textContent=JSON.stringify(snapshot,null,2);$('start').disabled=false;message('预检查通过，请核对参数后点击 Start。');}catch(e){invalidate();message(e.message);}};
$('start').onclick=async()=>{try{if(JSON.stringify(plan())!==checkedPlan)throw Error('参数已改变，请重新预检查');$('start').disabled=true;await api('/api/runs',plan());invalidate();await refresh();message('模拟实验已开始。');}catch(e){message(e.message);}};
$('draft').onclick=async()=>{try{const result=await api('/api/plan',{prompt:$('prompt').value});for(const [id]of fields)$(id).value=result.plan[id];$('setup_id').value=result.plan.setup_id;invalidate();setupDetail();$('preflight').textContent=JSON.stringify(result,null,2);message('已生成草稿，实验尚未开始。');}catch(e){message(e.message);}};
setInterval(()=>{if(token)refresh().catch(e=>message(e.message));},2500);
</script></body></html>
